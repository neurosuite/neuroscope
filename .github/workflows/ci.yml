name: CI

# The jobs set up the runners and call the job runner targets: the Makefile on Linux and macOS,
# make.ps1 on Windows. See those for what the targets do.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # libneurosuite revision NeuroScope is built against.
  # Switch to the v3.0.0 tag once libneurosuite is released.
  LIBNEUROSUITE_REF: main
  BUNDLE_NEUROSUITE: 'ON'

jobs:
  linux:
    name: build (ubuntu-24.04, WebEngine ${{ matrix.webengine }})
    # Branches in this repository are covered by the push run; build PRs from forks only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        webengine: [ON, OFF]
    steps:
      - uses: actions/checkout@v7
      - run: make ubuntu-deps WITH_WEBENGINE=${{ matrix.webengine }}
      - run: make check WITH_WEBENGINE=${{ matrix.webengine }}
      - uses: actions/upload-artifact@v7
        with:
          name: neuroscope-ubuntu-24.04-webengine-${{ matrix.webengine }}
          path: install/

  macos:
    name: build (macos-14)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - run: make macos-deps
      - run: make check
      - uses: actions/upload-artifact@v7
        with:
          name: neuroscope-macos-14-webengine-ON
          path: install/

  windows:
    name: build (windows)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - run: ./make.ps1 check
      - uses: actions/upload-artifact@v7
        with:
          name: neuroscope-windows-latest-webengine-ON
          path: install/

  nix:
    # Branches in this repository are covered by the push run; build PRs from forks only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: >
          nix build -L .#neuroscope
          --override-input libneurosuite "github:neurosuite/libneurosuite/${LIBNEUROSUITE_REF}"
