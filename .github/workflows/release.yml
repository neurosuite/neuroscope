name: Release

# Builds packages for a version tag and attaches them to a DRAFT release.
# A maintainer reviews the draft and publishes it by hand.
# The jobs set up the runners and call the job runner targets: the Makefile on Linux and macOS,
# make.ps1 on Windows. See those for what the targets do.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # libneurosuite revision packaged with (.deb) or bundled into (others) the application.
  LIBNEUROSUITE_REF: main

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make ubuntu-deps EXTRA_PACKAGES=libfuse2
      - name: Build .debs (QtWebEngine handbook, depends on libneurosuite3)
        run: make deb
      - name: Build AppImage (QTextBrowser handbook, smaller)
        run: make appimage
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            packages/*.deb
            packages/*.AppImage

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - run: make macos-deps
      - run: make dmg
      - name: Check the packaged application starts
        run: make dmg-check
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: packages/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@v1
      - run: ./make.ps1 windows-packages
      - name: Check the packaged application starts
        run: ./make.ps1 windows-packages-check
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            packages/*.exe
            packages/*.zip

  draft-release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: find dist -type f -exec sha256sum {} \; | sed 's|dist/.*/||; s|dist/||' > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.zip
            dist/SHA256SUMS
